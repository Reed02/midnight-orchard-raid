<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Midnight Orchard Raid</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#16231a;--ink:#fff7e6;--accent:#e4572e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",Verdana,sans-serif;overflow:hidden}
#wrap{position:relative;height:100%;display:flex;align-items:center;justify-content:center}
canvas{background:#6fae4b;image-rendering:pixelated;max-width:100%;max-height:100%;touch-action:none;border-radius:6px}
#ov{position:absolute;inset:0;display:flex;background:rgba(10,18,30,.88);text-align:center;overflow:hidden;padding:max(10px,env(safe-area-inset-top)) 12px 10px;box-sizing:border-box}
.ovin{margin:auto;display:flex;flex-direction:column;align-items:center;gap:clamp(6px,1.8vh,12px);max-width:min(94vw,700px);transform-origin:top center}
#ov h1{margin:0;font-size:clamp(22px,min(6vw,8vh),44px);line-height:1.1}
#ov p{margin:0;max-width:46ch;line-height:1.35;font-size:clamp(13px,min(3.4vw,3.8vh),17px)}
#ov p.tag{opacity:.88;font-size:clamp(14px,min(3.7vw,4.3vh),19px)}#ov p.best{opacity:.75}
.slot{background:#2d4a3a;min-width:0;font-size:12px;padding:5px 9px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
button{font:inherit;font-weight:700;font-size:clamp(14px,min(4vw,4.6vh),18px);padding:clamp(8px,1.8vh,12px) clamp(12px,3vw,22px);border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer}
button.big{font-size:clamp(18px,min(5vw,6vh),26px);padding:clamp(10px,2.4vh,16px) clamp(22px,6vw,40px);min-width:min(44vw,240px)}
button.big small{display:block;font-size:.5em;font-weight:400;opacity:.9;margin-top:2px}button.alt{background:#3a5ca8}
button.up{background:#2d4a3a;max-width:190px;font-size:clamp(12px,min(3.4vw,3.8vh),15px)}button.up b{display:block;font-size:clamp(14px,min(4vw,4.6vh),18px)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}

.seg{display:flex;border-radius:10px;overflow:hidden}.seg button{border-radius:0;background:#2d4a3a;opacity:.8;font-size:clamp(12px,min(3.4vw,3.8vh),15px)}.seg button.on{background:var(--accent);opacity:1}
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;text-align:left;width:100%}.krow{display:flex;align-items:center;gap:6px;justify-content:space-between;font-size:clamp(11px,min(3vw,3.4vh),15px)}
.lbl{font-size:clamp(12px,min(3.2vw,3.6vh),15px);opacity:.9}
#ov p.warn{color:#ffb74d}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
#tb{position:absolute;pointer-events:none;--s:clamp(54px,15vh,72px)}
#tb button{position:absolute;display:none;pointer-events:auto;width:var(--s);height:var(--s);border-radius:50%;padding:0;font-size:clamp(11px,2.6vh,14px);line-height:1.1;opacity:.82;user-select:none;-webkit-user-select:none;touch-action:none;border:2px solid rgba(255,255,255,.55)}
#dash{right:10px;bottom:10px;background:#3a5ca8}#shake,#whistle{right:10px;bottom:calc(var(--s) + 18px);background:#a86a2b}#whistle{background:#7a3fa8}#climb,#call{right:calc(var(--s) + 18px);bottom:10px;background:#3f7a4a}#call{background:#2b7a7a}

.rotbox{display:flex;flex-direction:column;gap:10px;align-items:center}.rotbox .phone{font-size:64px;animation:rotp 1.8s ease-in-out infinite}.rotbox b{font-size:22px}.rotbox span{opacity:.8}

</style></head><body>
<div id="wrap"><canvas id="c" width="800" height="560"></canvas><div id="tb"><button id="dash">Dash</button><button id="shake">Shake</button><button id="climb">Climb</button><button id="whistle">Whistle</button><button id="call">Dogs</button></div>
<div id="rot"><div class="rotbox"><div class="phone">&#128241;</div><b>Rotate your phone to play</b><span>This game is made for landscape.</span></div></div><div id="ov"></div></div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/* =====================================================================
   MIDNIGHT ORCHARD RAID
   1. SETTINGS  - tweak numbers here (balance, difficulty, scoring)
   2. UPGRADES  - add or edit the perks offered between nights
   3. GAME CODE - state, update, drawing, screens
   Images live in the last <script> at the bottom of this file (ASSETS).
   ===================================================================== */

/* ---------- 1. SETTINGS ---------- */
const CONFIG = {
  view:  { width: 800, height: 560 },        // what you see (canvas size)
  world: { width: 1200, height: 840 },       // the whole orchard; the camera follows the raccoon
  nightsToWin: 7,                            // survive this many nights to win (you can keep going afterwards)
  ratings: [['Bronze', 0], ['Silver', 700], ['Gold', 1400]],   // win-screen rating by score (rough guesses: tune after playing)
  player:  { speed: 220, carry: 3, carrySlow: 0.06,   // slowdown per carried apple (0.06 = 6%)
             spriteFacesRight: false,                  // which way the raccoon pictures look: false = left (flipped to face where he walks), true = right
             dashSpeed: 640, dashTime: 0.16, dashCooldown: 2.4,
             alertTime: 0.8,                           // seconds in the flashlight before you are caught
             hearts: 3, invulnerable: 2 },             // seconds of safety after being caught
  apples:  { groundPerNight: 10,       // ground apples you may pick up per night; after that, shake trees
             groundMax: 7,             // ground apples lying around at once
             spawnEvery: 1.4, goldChance: 0.2, goldValue: 3,   // golden apples only come from shaking
             fallTime: 0.45 },
  shake:   { time: 1.8,                // seconds of holding E to finish one shake
             range: 36,                // how close to a trunk you must stand
             apples: [2, 4],           // apples dropped per shake (min, max); each can be golden
             cooldown: 18,             // seconds before the same tree can be shaken again
             decay: 0.5,               // progress lost per second if you let go
             noiseRange: 260 },        // dogs this close hear the shaking and come running
  climb:   { range: 40, maxTime: 6, cooldown: 2 },       // hide up a tree from dogs (farmers can still see you)
  slam:    { radius: 130, stun: 4, time: 0.28, missRecovery: 0.7 },   // Space while up a tree
  multiplayer: { sendHz: 20,           // snapshots per second the host sends to the guest
                 // --- the human farmer ---
                 farmerSpeed: 165,     // walking speed (the raccoon walks at 220, and slower when stuffed with apples)
                 sprintSpeed: 235, sprintTime: 1.6, sprintCooldown: 7,   // farmer sprint (the dash key)
                 coneLength: 260, coneHalfAngle: 0.65,    // the human farmer's flashlight is bigger than the AI farmers' (190, 0.45)
                 seeRadius: 110, dogSeeRadius: 60,        // dim circle around the farmer, and around each dog
                 trackRange: 170, trackLife: 5, trackEvery: 0.26,   // raccoon footprints: how near the farmer must be, how long they last, and how often a print is left
                 bushErase: 0.9, bushScuffEvery: 0.5, bushSearch: 60,   // a bush swallows the last steps of the trail and leaves false marks around itself; a farmer who walks right up to it can still find the raccoon inside
                 touchRange: 30,                          // the farmer catches the raccoon by grabbing it from this close
                 closeBonus: 0.5, stackCap: 2.2,          // light catches faster up close, and when several farmers shine on the raccoon
                 // --- help and balance ---
                 aiFarmers: n => Math.min(3, 1 + Math.floor((n - 1) / 2)),   // AI farmers that patrol alongside the human, on night n
                 raccoonHearts: 4,
                 turnRate: 10,                            // how fast the human farmer's light turns to face the direction of travel
                 dogSightRadius: 110,                     // a dog this close to the raccoon (or chasing it) shows the raccoon to the farmer
                 grid: { cols: 3, rows: 2, cooldown: 3, searchTime: 14, sniffBonus: 1.4, callRadius: 170 },   // map grid: send the dogs to sweep one square
                 whistleCooldown: 6, whistleRange: 190, searchTime: 7 },     // whistle: dogs and AI farmers search the spot ahead of the light
  network: { peerServer: null, iceServers: null,        // multiplayer connection: null = the free PeerJS cloud and its default relay servers (set your own here if it is ever unreliable)
             attemptMs: 8000, attempts: 4, retryGapMs: 1500 },   // a guest tries the host this many times before giving up
  farmer:  { speed: 70, coneLength: 190, coneHalfAngle: 0.45, sweep: 0.5 },
  dog:     { speed: 135, sniffRange: 170, bushRange: 45 },
  den:     { x: 110, y: 740, radius: 48,                // deposit apples here (x, y are only a fallback: the den is placed at random)
             moveSingle: 'night', moveMulti: 'deposit',  // when it moves: 'never', 'night' (new spot each night) or 'deposit' (after every deposit)
             minJump: 420, margin: 90, farmerClearance: 260 },   // a new den is this far from the old one and the map edge, and (if possible) from the farmers
  scenery: { tree: 12, stone: 9, bush: 12 },             // how many of each per night
  spriteHeight: { farmer: 66, dog: 50 },              // on-screen height of the farmer and dog
  treeHeight: 84,                                      // on-screen height of the rustling tree
  sizeScale: 0.8,                                      // draw size of trees/bushes/stones
  bankScore: n => n * (n + 1) / 2,                     // points for banking n apples at once (greed pays)
  timeBonus: 2,                                        // points per second left at dawn
  // Difficulty per night (n = 1, 2, 3 ...). The last night (nightsToWin) is a harder finale.
  night: n => { const fin = n === CONFIG.nightsToWin ? 1 : 0;
    return { quota: 6 + n * 2 + fin * 4, time: 70 + n * 5 + fin * 10,
             farmers: Math.min(4, 1 + Math.floor(n / 2)),
             dogs: (n < 3 ? 0 : Math.min(3, 1 + Math.floor((n - 3) / 2))) + fin }; },
};

/* ---------- 2. UPGRADES (pick 1 of 3 after each night) ---------- */
const UPGRADES = [
  { name: 'Big Cheeks',  desc: 'Carry +2 apples',        apply: s => s.carry += 2 },
  { name: 'Fast Paws',   desc: 'Move 10% faster',        apply: s => s.speed *= 1.1 },
  { name: 'Quick Dash',  desc: 'Dash recharges 25% faster', apply: s => s.dashCd *= 0.75 },
  { name: 'Thick Fur',   desc: 'Slower to get spotted',  apply: s => s.alert *= 1.35 },
  { name: 'Lucky Nose',  desc: 'More golden apples',     apply: s => s.gold += 0.1 },
  { name: 'Strong Arms', desc: 'Shake trees 30% faster', apply: s => s.shakeT *= 0.7 },
  { name: 'Extra Heart', desc: '+1 heart now',           apply: s => { s.hearts++; hearts++; } },
];

const FARMER_UPGRADES = [                                    // multiplayer: the farmer also picks 1 of 3 after each night (small steps, so neither side runs away with it)
  { name: 'Long Beam',      desc: 'Flashlight reaches 20% farther',        apply: f => f.coneLen = Math.min(420, f.coneLen * 1.2) },
  { name: 'Wide Beam',      desc: 'Flashlight is a bit wider',             apply: f => f.coneHalf = Math.min(0.9, f.coneHalf + 0.07) },
  { name: 'Quick Boots',    desc: 'Walk and sprint 8% faster',             apply: f => { f.speed = Math.min(215, f.speed * 1.08); f.sprintSpeed = Math.min(300, f.sprintSpeed * 1.08); } },
  { name: 'Second Wind',    desc: 'Sprint recharges 25% faster',           apply: f => f.sprintCd = Math.max(3, f.sprintCd * 0.75) },
  { name: 'Silver Whistle', desc: 'Whistle and dog orders recharge faster', apply: f => { f.whistleCd = Math.max(2.5, f.whistleCd * 0.7); f.orderCd = Math.max(1.5, f.orderCd * 0.7); } },
  { name: 'Good Nose',      desc: 'Footprints last longer and show from farther', apply: f => { f.trackLife += 1.2; f.trackRange += 40; } },
  { name: 'Hound Handler',  desc: 'Dogs smell the raccoon from farther',   apply: f => f.dogSniff = Math.min(1.8, f.dogSniff * 1.2) },
  { name: 'Night Eyes',     desc: 'A bigger glow around you',              apply: f => f.seeRadius += 30 },
];

/* ---------- KEY BINDINGS (defaults; players change them from the title screen, saved per browser) ----------
   Each action has two slots. Names are lower-case key names: 'w', 'arrowup', ' ' (space), 'shift' ... */
const DEFAULT_KEYS = {
  up:    ['w', 'arrowup'],    down:  ['s', 'arrowdown'],
  left:  ['a', 'arrowleft'],  right: ['d', 'arrowright'],
  shake: ['e', ''],           climb: ['c', ''],
  dash:  [' ', 'shift'],
  whistle: ['f', ''],         // farmer only (multiplayer)
  map:   ['m', ''],           // farmer only: show / hide the map
  mute:  ['n', ''],           // mute / unmute all sound
  call:  ['g', ''],           // farmer only: send the dogs to where the raccoon was last seen
  pause: ['p', 'escape'],     // pause (single player)
  aim:   ['q', ''],           // farmer only: hold to aim the light with the mouse (it normally follows where you walk)
};
const KEY_LABELS = { up: 'Up', down: 'Down', left: 'Left', right: 'Right', shake: 'Shake tree', climb: 'Climb', dash: 'Dash / sprint', whistle: 'Whistle (farmer)', call: 'Call dogs (farmer)', aim: 'Aim light (farmer)', map: 'Map (farmer)', mute: 'Mute', pause: 'Pause' };

/* ---------- 3. GAME CODE ---------- */
const $ = id => document.getElementById(id);
const cv = $('c'), g = cv.getContext('2d'), IMG = {};
cv.width = CONFIG.view.width; cv.height = CONFIG.view.height;
const VW = cv.width, VH = cv.height, W = CONFIG.world.width, H = CONFIG.world.height;   // view (screen) and world sizes
const cam = { x: 0, y: 0 };
const den = { x: CONFIG.den.x, y: CONFIG.den.y, radius: CONFIG.den.radius };          // where you spawn and deposit; it moves (see CONFIG.den)                                                              // camera top-left, in world coordinates
const keys = {}; let drag = null, rebinding = null;       // rebinding = { action, slot } while waiting for a key press
const BIND = JSON.parse(JSON.stringify(DEFAULT_KEYS));
try { const saved = JSON.parse(localStorage.getItem('raidKeys')); if (saved) for (const a in BIND) if (saved[a] && saved[a].length === 2) BIND[a] = saved[a]; } catch (e) {}
const saveBind = () => { try { localStorage.setItem('raidKeys', JSON.stringify(BIND)); } catch (e) {} };
const held = a => BIND[a].some(k => k && keys[k]) || !!keys['__' + a];     // is any key for this action down (or its touch button)?
const keyName = k => k ? ({ ' ': 'Space', arrowup: '↑', arrowdown: '↓', arrowleft: '←', arrowright: '→', shift: 'Shift', control: 'Ctrl', alt: 'Alt', enter: 'Enter', tab: 'Tab' }[k] || k.toUpperCase()) : '—';
let multi = false, isHost = true, myRole = 'raccoon';     // multiplayer: who owns the simulation, and which role this machine plays
const remote = { mx: 0, my: 0, shake: false, aim: 0, t: 0, sq: 0, ack: -2 }, mouse = { on: false, x: 0, y: 0 };   // the other player's inputs (host side); mouse position
const kn = a => keyName(BIND[a].find(k => k) || '');
let state = 'title', night = 0, score = 0, hearts = 0, S, P, obs, apples, farmers, dogs, carry;
let endless = false, groundLeft = 0, climbT = 0, climbCd = 0, slam = null, shaking = false, shakeTree = null, shakeAmt = 0;
let startleT = 0, time, banked, quota, alertV, inv, dashT, dashCd, dir, spawnT, t = 0, flash = 0, pops = [], last = 0, anim = 0, msgText = '';
const tufts = [...Array(160)].map(() => ({ x: Math.random() * W, y: Math.random() * H }));
const solid = o => o.k !== 'bush';
const rnd = (a, b) => a + Math.random() * (b - a);

/* ----- input ----- */
addEventListener('keydown', e => {
  if (rebinding) return captureKey(e);
  const k = e.key.toLowerCase(); keys[k] = true;
  if (!e.repeat) { if (BIND.dash.includes(k)) localEvent('dash'); if (BIND.climb.includes(k)) localEvent('climb'); if (BIND.whistle.includes(k)) localEvent('whistle'); if (BIND.call.includes(k)) localEvent('call'); if (BIND.map.includes(k) && viewRole() === 'farmer') mapOpen = !mapOpen; if (BIND.mute.includes(k)) toggleMute(); if (BIND.pause.includes(k)) togglePause(); }
  if (state === 'play' && (e.key.startsWith('Arrow') || e.key === ' ')) e.preventDefault();
});
addEventListener('blur', () => { for (const k in keys) keys[k] = false; drag = null; wheel = null; });
addEventListener('visibilitychange', () => { if (document.hidden) { for (const k in keys) keys[k] = false; drag = null; wheel = null; pauseGame(); } });
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
const pt = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * VW / r.width, y: (e.clientY - r.top) * VH / r.height }; };
cv.addEventListener('pointerdown', e => {
  const p = pt(e);
  if (speakerHit(p)) return toggleMute(); if (pauseHit(p)) return pauseGame();
  if (TOUCH.mode === 'wheel' && state === 'play' && !wheel && Math.hypot(p.x - WHEEL.x, p.y - WHEEL.y) < WHEEL.r * 1.9) {       // a finger on the wheel always steers, even where something else is drawn
    wheel = { id: e.pointerId, dx: 0, dy: 0 }; wheelMove(p); try { cv.setPointerCapture(e.pointerId); } catch (x) {} return;
  }
  if (multi && myRole === 'farmer' && state === 'play') { const c = gridCellAt(p); if (c >= 0) return localEvent('grid', c); }
  if (TOUCH.mode === 'wheel') return;                        // wheel mode: touching anywhere else does nothing
  if (multi && myRole === 'farmer' && e.pointerType === 'mouse') return; drag = p; try { cv.setPointerCapture(e.pointerId); } catch (x) {}
});
cv.addEventListener('pointermove', e => { if (e.pointerType === 'mouse') { const p = pt(e); mouse.on = true; mouse.x = p.x; mouse.y = p.y; } if (wheel && e.pointerId === wheel.id) wheelMove(pt(e)); if (drag) drag = pt(e); });
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => cv.addEventListener(ev, e => { drag = null; if (wheel && (e.pointerId === undefined || e.pointerId === wheel.id)) wheel = null; }));
// Safety nets so the wheel can never stay stuck pointing one way: release it whichever element the lift lands on, and when no finger is left at all.
['pointerup', 'pointercancel'].forEach(ev => addEventListener(ev, e => { if (wheel && e.pointerId === wheel.id) wheel = null; }, true));
['touchend', 'touchcancel'].forEach(ev => addEventListener(ev, e => { if (!e.touches || !e.touches.length) { wheel = null; drag = null; } }, { capture: true, passive: true }));
$('dash').addEventListener('pointerdown', e => { e.stopPropagation(); localEvent('dash'); });
$('call').addEventListener('pointerdown', e => { e.stopPropagation(); localEvent('call'); });
$('climb').addEventListener('pointerdown', e => { e.stopPropagation(); localEvent('climb'); });
$('whistle').addEventListener('pointerdown', e => { e.stopPropagation(); localEvent('whistle'); });
$('shake').addEventListener('pointerdown', e => { e.stopPropagation(); keys.__shake = true; });
['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => $('shake').addEventListener(ev, () => keys.__shake = false));
const buttons = on => {                                     // on-screen action buttons: touch devices only (with a keyboard the keys do it)
  const r = viewRole() === 'raccoon', show = on && isTouch;
  $('dash').textContent = r ? 'Dash' : 'Sprint'; $('dash').style.display = show ? 'block' : 'none';
  for (const id of ['shake', 'climb']) $(id).style.display = show && r ? 'block' : 'none';
  for (const id of ['whistle', 'call']) $(id).style.display = show && !r ? 'block' : 'none';
  if (show) layoutTouch();
};

/* ===== MULTIPLAYER: two players, one raccoon and one farmer =====
   Needs the published page. The platform's "room" capability relays small messages between everyone who has the page
   open, so players on different networks can join with a 4-letter code. The HOST runs the whole game; the GUEST sends
   its inputs and draws the snapshots the host sends back. The farmer sees only black except inside the flashlight. */
const net = { room: null, r: null, code: '', hosting: null, guestPeer: null, hostPeer: null, myPeer: null, unsubs: [], timer: 0, helloTimer: 0, helloTries: 0,
              sid: 0, sidSeen: -1, epoch: -1, inpSq: 0, snapSq: 0, lastSq: -1, rtt: 0, lastSig: '', scrId: 0, scrSeen: -1, evId: 0, seen: new Set(), sentAt: 0, inpAt: 0, inGame: false, loopId: 0, scr: null, lastNight: null, tick: 0, lastSnapAt: 0 };
let epoch = 0, pdashT = 0;                                // epoch counts host-side position changes (teleports, climbing...) so the guest knows to snap
const bumpEpoch = () => { epoch++; };
const NET_VERSION = 14;                                    // bump when the two players' messages change, so a stale cached copy of the page is detected
const otherRole = r => r === 'raccoon' ? 'farmer' : 'raccoon';
const viewRole = () => multi ? myRole : 'raccoon';
const myFarmer = () => farmers.find(f => f.human);
const myEntity = () => (multi && myRole === 'farmer') ? (myFarmer() || P) : P;
const clampN = (v, a, b) => Math.max(a, Math.min(b, v));
const angDiff = (a, b) => Math.atan2(Math.sin(a - b), Math.cos(a - b));
const num = v => +v || 0;
function nsend(topic, data) { try { if (net.r) Promise.resolve(net.r.emit(topic, data)).catch(() => {}); } catch (e) {} }
async function netInit() { net.room = typeof Peer !== 'undefined' ? { peerjs: true } : null; }

/* ----- PeerJS room adapter (replaces the Claude-hosted room service) -----
   GitHub Pages hosts this file; PeerJS's signaling server helps the two browsers
   establish a direct WebRTC data connection. The host still simulates the game. */
async function peerRoomJoin(code, hosting) {
  if (typeof Peer === 'undefined') throw netError('lib', 'The multiplayer library did not load.');
  const N = CONFIG.network, hostId = 'midnightorchard-' + code;
  const opts = Object.assign({ debug: 1 }, N.peerServer || {}); if (N.iceServers) opts.config = { iceServers: N.iceServers };
  const peer = hosting ? new Peer(hostId, opts) : new Peer(opts);
  const listeners = new Map();
  const peerListeners = new Set();
  const connections = new Map();
  const pending = [];
  let closed = false;
  let selfId = '';
  const dispatch = (topic, data, peerId, isMe=false) => {
    for (const fn of listeners.get(topic) || []) {
      try { fn({ data, peer: peerId, isMe, sameTab: isMe }); } catch (e) { console.error(e); }
    }
  };
  const announceLeft = id => {
    connections.delete(id);
    for (const fn of peerListeners) { try { fn({ left: [{ peer: id }] }); } catch (e) {} }
  };
  const attach = conn => {
    connections.set(conn.peer, conn);
    conn.on('data', packet => {
      if (!packet || typeof packet.topic !== 'string') return;
      dispatch(packet.topic, packet.data || {}, conn.peer, false);
    });
    conn.on('close', () => announceLeft(conn.peer));
    conn.on('error', () => {});
    conn.on('open', () => { while (pending.length) { const packet = pending.shift(); try { conn.send(packet); } catch(e) {} } });
  };
  // Keep the room reachable: if the browser drops our link to the matchmaking server (a phone switching apps, a sleeping screen, a flaky network), reconnect with the same id.
  const keepAlive = () => { if (closed || peer.destroyed) return; if (peer.disconnected) { try { peer.reconnect(); } catch (e) {} } };
  peer.on('disconnected', () => { setTimeout(keepAlive, 500); });
  const watchdog = setInterval(keepAlive, 4000);
  document.addEventListener('visibilitychange', keepAlive);

/* ----- music: a music-box waltz in A minor (chords Am Dm E7 Am F Dm E7 Am), with a creeping bass and a heartbeat when tense ----- */
const CHORDS = [{ b: 45, c: [57, 60, 64] }, { b: 50, c: [62, 65, 69] }, { b: 52, c: [56, 59, 62] }, { b: 45, c: [57, 60, 64] }, { b: 41, c: [53, 57, 60] }, { b: 50, c: [62, 65, 69] }, { b: 52, c: [56, 59, 62] }, { b: 45, c: [57, 60, 64] }];
const MELODY = [                                           // per bar: [beat, midi note, length in beats]
  [[0, 76, .5], [1, 72, .5], [1.5, 76, .5], [2, 81, 1]], [[0, 77, .5], [1, 74, .5], [1.5, 77, .5], [2, 81, 1]],
  [[0, 80, .5], [1, 76, .5], [1.5, 80, .5], [2, 83, 1]], [[0, 81, 1], [1, 76, .5], [1.5, 72, .5], [2, 69, 1]],
  [[0, 77, .5], [1, 72, .5], [1.5, 77, .5], [2, 81, 1]], [[0, 74, .5], [1, 77, .5], [1.5, 81, .5], [2, 86, 1]],
  [[0, 83, .5], [1, 80, .5], [1.5, 76, .5], [2, 74, 1]], [[0, 76, 1], [1, 72, 1], [2, 69, 1]],

const mBell = (f, t, dur, v) => { aTone({ t, f, dur, vol: v, a: .003, bus: AUD.musicBus }); aTone({ t, f: f * 2.76, dur: dur * .3, vol: v * .3, a: .002, bus: AUD.musicBus }); };

function mPad(freqs, t, dur, v) {                         // a slow, dark hum underneath
  const c = AUD.ctx, g = c.createGain(), lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 380;
